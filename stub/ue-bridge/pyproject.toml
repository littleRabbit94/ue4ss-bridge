[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Final release of the old name. It ships no code: installing or upgrading it pulls in
# ue4ss-bridge, which also installs the ue-bridge command.
[project]
name = "ue-bridge"
version = "1.2.0"
description = "Renamed to ue4ss-bridge. This package only installs ue4ss-bridge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["ue4ss-bridge>=1.2.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/littleRabbit94/ue4ss-bridge"

[tool.hatch.build.targets.wheel]
bypass-selection = true
