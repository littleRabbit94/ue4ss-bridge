[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue-bridge"
version = "1.0.0"
description = "Run Lua inside a live UE4SS game from outside it: an MCP server and CLI for the UEBridge mod."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["unreal", "ue4ss", "mcp", "modding", "lua"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
# 1.8 is where streamable HTTP arrived; 2.x renamed FastMCP.
dependencies = ["mcp>=1.8,<2"]

[project.scripts]
ue-bridge = "ue_bridge.server:main"

[project.urls]
Source = "https://github.com/littleRabbit94/ue-bridge"

[tool.hatch.build.targets.wheel]
packages = ["ue_bridge"]

[tool.hatch.build.targets.sdist]
include = ["ue_bridge", "ue4ss", "README.md", "LICENSE"]
