[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue4ss-bridge"
version = "1.2.1"
description = "Talk to a running UE4SS game: inspect objects, call functions, watch properties, hook functions, run Lua, while it plays. An MCP server and CLI plus the UEBridge mod."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["unreal", "ue4ss", "mcp", "modding", "lua"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
# 1.8 is where streamable HTTP arrived; 2.x renamed FastMCP.
dependencies = ["mcp>=1.8,<2"]

[project.scripts]
ue4ss-bridge = "ue4ss_bridge.server:main"
# Compatibility alias: MCP client configs written against the old name keep launching.
ue-bridge = "ue4ss_bridge.server:main"

[project.urls]
Source = "https://github.com/littleRabbit94/ue4ss-bridge"

[tool.hatch.build.targets.wheel]
packages = ["ue4ss_bridge"]

[tool.hatch.build.targets.sdist]
include = ["ue4ss_bridge", "ue4ss", "README.md", "CHANGELOG.md", "LICENSE"]
